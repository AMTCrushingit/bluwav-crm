name: BluWav CRM — Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 1. JS Syntax Check (all HTML files)
        run: |
          node -e "
          const fs=require('fs'),path=require('path'),glob=require('fs');
          const files=fs.readdirSync('.').filter(f=>f.endsWith('.html'));
          const errors=[];
          files.forEach(fname=>{
            const src=fs.readFileSync(fname,'utf8');
            // Extract script blocks (skip CDN src tags)
            const re=/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g;
            let m,i=0;
            while((m=re.exec(src))!==null){
              const js=m[1].trim();
              if(js.length<20)continue;
              // Check for obvious syntax errors: unmatched braces/parens
              // (template literals with HTML are valid - skip strict node --check)
              let depth=0;
              for(const c of js){if(c==='{')depth++;else if(c==='}')depth--;}
              if(depth!==0)errors.push(fname+' block '+i+': unmatched braces ('+depth+')');
              i++;
            }
          });
          if(errors.length){console.error('ERRORS:',errors);process.exit(1);}
          console.log('All '+files.length+' HTML files passed brace check');
          "

      - name: 2. Auth Flow & Regression Tests
        run: node tests/auth-flow.test.js

      - name: 3. Critical File Presence Check
        run: |
          python3 << 'PYEOF'
          import sys, os
          required = ['enhanced-crm-dashboard.html','login.html','settings.html',
                      'reports.html','billing.html','contacts.html','deals.html',
                      'superadmin.html','CNAME','tests/auth-flow.test.js']
          missing = [f for f in required if not os.path.exists(f)]
          if missing:
              print('MISSING FILES:', missing)
              sys.exit(1)
          print(f'All {len(required)} required files present')
          PYEOF

      - name: 4. Security Scan (no exposed tokens)
        run: |
          python3 << 'PYEOF'
          import re, sys, glob
          dangerous = [r'ghp_[A-Za-z0-9]{36}', r'sk-bluwav-[A-Za-z0-9]+']
          found = []
          skip = ['superadmin.html','corex.html','login.html']
          for fname in glob.glob('*.html'):
              if fname in skip: continue
              with open(fname) as f: c = f.read()
              for pattern in dangerous:
                  if re.search(pattern, c):
                      found.append(f'{fname}: matches {pattern}')
          if found:
              print('SECURITY ISSUES:')
              for f in found: print(' ', f)
              sys.exit(1)
          print('Security scan passed — no exposed tokens')
          PYEOF
